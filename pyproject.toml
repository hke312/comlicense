[project]
name = "comlicense-grader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
comlicense-grader = "comlicense_grader:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
